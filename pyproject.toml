[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voynich-research"
version = "0.1.0"
description = "Reproducible structural research on Voynich transcriptions"
requires-python = ">=3.11"

[project.scripts]
voynich = "voynich.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
