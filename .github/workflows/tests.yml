name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run lexicon experiment tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/lexicon -p 'test_*.py' -v
      - name: Run homophonic experiment tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/homophonic -p 'test_*.py' -v
      - name: Run identifiability experiment tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/identifiability -p 'test_*.py' -v
      - name: Run optimal-set experiment tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/optimal_set -p 'test_*.py' -v
      - name: Run medical projection tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/medical -p 'test_*.py' -v
      - name: Run pivot-group bound tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/group_bound -p 'test_*.py' -v
      - name: Run lexical local-search tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/lexical_warmstart -p 'test_*.py' -v
      - name: Run search-development tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/search_development -p 'test_*.py' -v
      - name: Run cyclic-pairing tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/cyclic_pairing -t . -p 'test_*.py' -v
      - name: Run local cyclic certificate tests
        run: PYTHONPATH=src:. python -m unittest discover -s experiments/local_cyclic -t . -p 'test_*.py' -v
      - name: Run line-phase command checks
        run: |
          python scripts/check_line_phase_lattice.py
          python scripts/check_line_phase_freeze.py results/line-phase-freeze-ci.json
      - name: Check public line-phase certificates
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from line_phase_lattice import verify_certificate
          root = pathlib.Path('reports/line-phase-lattice-v1')
          result = json.loads((root / 'result.json').read_text())
          proved = stopped = 0
          for source in result['sources']:
              for track in source['tracks']:
                  path = root / track['certificate_file']
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == track['certificate_sha256']
                  proof = json.loads(path.read_text())
                  assert proof['status'] == track['status']
                  if proof['status'] == 'certified':
                      verify_certificate(proof)
                      proved += 1
                  else:
                      assert proof['status'] == 'not_certified'
                      assert proof['reason'] == 'an intermediate integer exceeded the 4,096-bit limit'
                      assert not proof['support_rows'] and not proof['left_inverse']
                      stopped += 1
          assert (proved, stopped) == (5, 3)
          print(f'{proved} proofs checked; {stopped} resource stops preserved')
          PY
